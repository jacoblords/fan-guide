<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rooting Guide</title>
<meta name="description" content="Pick your team: this week's college football games that matter to you, who to root for, and why.">
<style>
  :root {
    --bg: #f6f6f3; --card: #ffffff; --ink: #1b1d21; --muted: #646a73; --line: #e2e3e0;
    --good: #1f8a4c; --bad: #c2362f; --warn: #b7791f; --accent: #2557d6; --chip: #eef0f3;
    --star: #e0a400; --star-off: #d9dbde;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121417; --card: #1b1e23; --ink: #eceef1; --muted: #9aa1ab; --line: #2b3038;
      --good: #4cc282; --bad: #f0645b; --warn: #e5a93a; --accent: #7aa2ff; --chip: #262a31;
      --star: #f5c542; --star-off: #3a3f47;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121417; --card: #1b1e23; --ink: #eceef1; --muted: #9aa1ab; --line: #2b3038;
    --good: #4cc282; --bad: #f0645b; --warn: #e5a93a; --accent: #7aa2ff; --chip: #262a31;
    --star: #f5c542; --star-off: #3a3f47;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .bar { max-width: 860px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  h1 { font-size: 18px; margin: 0 8px 0 0; letter-spacing: -0.01em; }
  select, button { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  button { cursor: pointer; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 6px 10px; background: var(--card); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  main { max-width: 860px; margin: 0 auto; padding: 12px 16px 60px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 4px; background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
  .chip button { border: 0; background: none; padding: 0 0 0 2px; color: var(--muted); }
  .tag { font-size: 12px; font-weight: 600; border-radius: 6px; padding: 1px 7px; background: var(--chip); }
  .tag.mine { background: var(--accent); color: #fff; }
  .tag.conflict { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
  .tag.heart { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
  .tag.won { background: color-mix(in srgb, var(--good) 20%, transparent); color: var(--good); }
  .tag.lost { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .card.mine { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: 13px; color: var(--muted); }
  .meta .right { margin-left: auto; }
  .matchup { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin: 8px 0 6px; }
  .team { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 4px 8px; border-radius: 8px; }
  .team.home { justify-content: flex-end; text-align: right; }
  img.logo { width: 30px; height: 30px; object-fit: contain; flex: none; }
  .suffer img.logo { width: 22px; height: 22px; }
  .team img { width: 30px; height: 30px; object-fit: contain; flex: none; }
  .team .nm { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .team .sub { font-size: 12px; color: var(--muted); }
  .team.pick { background: color-mix(in srgb, var(--good) 13%, transparent); outline: 1.5px solid var(--good); }
  .vs { font-size: 12px; color: var(--muted); text-align: center; }
  .rootfor { font-weight: 650; }
  .stars { letter-spacing: 1px; white-space: nowrap; font-size: 15px; }
  .stars .half { background: linear-gradient(90deg, var(--star) 50%, var(--star-off) 50%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .stars .neg + .half { background: linear-gradient(90deg, var(--bad) 50%, var(--star-off) 50%); -webkit-background-clip: text; background-clip: text; }
  .stars .on { color: var(--star); } .stars .off { color: var(--star-off); } .stars .neg { color: var(--bad); }
  .sig { display: grid; grid-template-columns: 170px 92px 1fr; gap: 2px 10px; align-items: baseline; padding: 4px 0; border-top: 1px dashed var(--line); font-size: 13.5px; }
  .sig .lab { font-weight: 600; }
  .sig .soft { font-weight: 400; color: var(--muted); font-size: 11.5px; }
  .tug { display: grid; grid-template-columns: 150px 1fr; gap: 4px 10px; align-items: center; font-size: 13px; margin-top: 4px; }
  .tug .track { position: relative; height: 14px; background: var(--chip); border-radius: 7px; }
  .tug .track::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1.5px; background: var(--muted); }
  .tug .fill { position: absolute; top: 2px; bottom: 2px; border-radius: 5px; }
  .tug .why { grid-column: 2; color: var(--muted); font-size: 12.5px; margin: -2px 0 4px; }
  .tug .ends { grid-column: 2; display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .chips2 { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
  .chips2 .chip.up { background: color-mix(in srgb, var(--good) 16%, transparent); }
  .chips2 .chip.down { background: color-mix(in srgb, var(--bad) 14%, transparent); }
  ul.why { margin: 4px 0 0; padding-left: 18px; font-size: 13.5px; }
  .meter { height: 8px; border-radius: 4px; background: var(--chip); overflow: hidden; margin: 6px 0; }
  .meter > div { height: 100%; background: var(--accent); }
  .score { font-variant-numeric: tabular-nums; font-weight: 700; }
  details summary { cursor: pointer; font-weight: 600; }
  .weights { display: grid; grid-template-columns: 190px 1fr 36px; gap: 6px 10px; align-items: center; margin-top: 8px; font-size: 14px; }
  .suffer { display: grid; gap: 6px; margin-top: 6px; }
  .suffer .it { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
  .suffer img { width: 22px; height: 22px; object-fit: contain; }
  .more { width: 100%; padding: 10px; }
  a { color: var(--accent); }
  .banner { background: color-mix(in srgb, var(--warn) 15%, transparent); border-radius: 8px; padding: 6px 10px; font-size: 13px; margin-bottom: 10px; }
  @media (max-width: 600px) {
    .sig { grid-template-columns: 1fr auto; }
    .sig .txt { grid-column: 1 / -1; }
    .tug { grid-template-columns: 1fr; }
    .tug .why, .tug .ends { grid-column: 1; }
    .weights { grid-template-columns: 1fr 1fr 32px; }
    .team img { width: 24px; height: 24px; }
    .team .sub { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Rooting Guide</h1>
    <label class="small muted" for="team">My team</label>
    <select id="team" aria-label="Your team"></select>
    <span class="seg" id="weeks" role="group" aria-label="Week"></span>
    <span class="seg" id="styles" role="group" aria-label="Card style">
      <button data-style="stars">Stars</button><button data-style="tug">Tug-of-war</button><button data-style="chips">Chips</button>
    </span>
  </div>
</header>
<main>
  <div id="banner"></div>
  <section class="panel" id="summary"></section>
  <section class="panel">
    <details id="tune">
      <summary>Rivals and weights</summary>
      <div class="small muted" style="margin:6px 0">Rivals: you root against them, and the guide finds the games that would hurt them most.</div>
      <div class="row" id="rivals"></div>
      <div class="row" style="margin-top:8px">
        <select id="addRival" aria-label="Add a rival"></select>
        <button id="resetRivals">Reset to defaults</button>
      </div>
      <div class="weights" id="weights"></div>
      <div class="row" style="margin-top:8px"><button id="resetWeights">Reset weights</button></div>
    </details>
  </section>
  <section id="feed"></section>
  <p class="small muted" id="foot"></p>
</main>
<script src="score.js"></script>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("rg." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("rg." + k, JSON.stringify(v)); } catch {} },
};
let DATA, IX, RIVALS, state = { team: null, week: null, style: store.get("style", "stars"), showAll: false };

function rivalsFor(tid) {
  const saved = store.get("rivals." + tid, null);
  return saved || FanScore.defaultRivals(IX, RIVALS, tid);
}
function weights() { return { ...FanScore.DEFAULT_WEIGHTS, ...store.get("weights", {}) }; }
function fan() {
  return { team: state.team, rivals: rivalsFor(state.team), weights: weights(), rivalsOf: (r) => FanScore.defaultRivals(IX, RIVALS, r) };
}
const T = (id) => IX.teams.get(id) || { id, short: "TBD", color: "#888" };
const tname = (id) => { const t = T(id); return t.short || t.school || t.abbr || "Opponent"; };
const rankName = (id) => { const t = T(id); return (t.rank ? `<span class="muted">${t.rank}</span> ` : "") + esc(tname(id)); };
const logo = (id) => { const t = T(id); return t.logo ? `<img class="logo" alt="" loading="lazy" src="${esc(t.logo)}">` : `<span style="width:30px"></span>`; };
const rec = (id) => { const r = T(id).record; return r ? `${r[0]}-${r[1]}` : ""; };

function starsHTML(v, max = 5) {
  // v may be negative: shown as red stars with a minus sign.
  const n = Math.round(Math.abs(v) * 2) / 2;
  if (n < 0.5) return `<span class="stars"><span class="off">${"☆".repeat(max)}</span></span>`;
  const full = Math.floor(n), half = n - full >= 0.5;
  const cls = v < 0 ? "neg" : "on";
  let s = `<span class="${cls}">${v < 0 ? "−" : ""}${"★".repeat(full)}</span>${half ? `<span class="half">★</span>` : ""}`;
  s += `<span class="off">${"☆".repeat(max - full - (half ? 1 : 0))}</span>`;
  return `<span class="stars" aria-label="${v < 0 ? "minus " : ""}${n} of ${max} stars">${s}</span>`;
}

function kickoff(g) {
  const d = new Date(g.date);
  const day = d.toLocaleDateString(undefined, { weekday: "short" });
  if (g.timeValid === false) return `${day} · time TBA`;
  return `${day} ${d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })}`;
}

function teamCell(r, side) {
  const g = r.game, id = g[side], p = side === "home" ? r.p : 1 - r.p;
  const score = g.done && !g.canceled ? `<span class="score">${side === "home" ? g.homeScore : g.awayScore}</span>` : "";
  const inner = `${logo(id)}<div style="min-width:0"><div class="nm">${rankName(id)}</div><div class="sub">${rec(id)} · ${FanScore.pct(p)} to win</div></div>`;
  return `<div class="team ${side} ${r.pick === id ? "pick" : ""}">${side === "home" ? score + inner : inner + score}</div>`;
}

function tags(r) {
  const t = [];
  if (r.mine) t.push(`<span class="tag mine">Your game</span>`);
  if (r.conflict) t.push(`<span class="tag conflict" title="Strong signals point different ways">Conflicted</span>`);
  if (r.heart) t.push(`<span class="tag heart">😈 Rival</span>`);
  if (r.spectacle >= 3) t.push(`<span class="tag">Good game</span>`);
  if (r.result) t.push(`<span class="tag ${r.result}">${r.result === "won" ? "✓ Went your way" : "✗ Didn't"}</span>`);
  return t.join("");
}

function sigText(s) {
  return esc(s.text) + (s.link ? ` <a href="${esc(s.link)}" target="_blank" rel="noopener">paths</a>` : "");
}

function bodyStars(r) {
  return r.signals.map((s) => `<div class="sig"><div class="lab">${esc(s.label)}${s.soft ? ' <span class="soft">soft</span>' : ""}</div>
    <div>${starsHTML(s.rel)}</div><div class="txt muted">${sigText(s)}</div></div>`).join("");
}

function bodyTug(r) {
  const g = r.game, ca = T(g.away).color || "#888", ch = T(g.home).color || "#888";
  const rows = r.signals.map((s) => {
    const w = Math.min(50, (Math.abs(s.stars) / 5) * 50);
    const toHome = s.stars > 0;
    const style = toHome ? `left:50%;width:${w}%;background:${ch}` : `right:50%;width:${w}%;background:${ca}`;
    return `<div class="lab">${esc(s.label)}${s.soft ? ' <span class="muted small">(soft)</span>' : ""}</div>
      <div class="track" title="${esc(s.text)}"><div class="fill" style="${style}"></div></div>
      <div class="why">${sigText(s)}</div>`;
  }).join("");
  return `<div class="tug"><div></div><div class="ends"><span>◀ ${esc(tname(g.away))}</span><span>${esc(tname(g.home))} ▶</span></div>${rows}</div>`;
}

function bodyChips(r) {
  const chips = r.signals.map((s) => `<span class="chip ${s.rel > 0.25 ? "up" : s.rel < -0.25 ? "down" : ""}">${s.rel > 0.25 ? "▲" : s.rel < -0.25 ? "▼" : "•"} ${esc(s.label)}</span>`).join("");
  const why = r.signals.map((s) => `<li>${sigText(s)}</li>`).join("");
  return `<div class="meter" title="How much this game matters to you"><div style="width:${(r.stars / 5) * 100}%"></div></div>
    <div class="chips2">${chips}</div><ul class="why muted">${why}</ul>`;
}

function card(r) {
  const g = r.game;
  const live = g.status ? ` · <b>${esc(g.status)}</b>` : "";
  const root = r.mine ? `Go ${esc(tname(r.pick))}` : r.pick ? `Root for ${esc(tname(r.pick))}` : "No rooting interest";
  const body = !r.signals.length ? `<div class="muted small">${r.mine ? "" : "Nothing riding on it for you; just football."}</div>`
    : state.style === "tug" ? bodyTug(r) : state.style === "chips" ? bodyChips(r) : bodyStars(r);
  return `<article class="card ${r.mine ? "mine" : ""}">
    <div class="meta">${tags(r)}<span>${esc(kickoff(g))}${g.tv ? " · " + esc(g.tv) : ""}${g.spread ? " · " + esc(g.spread) : ""}${live}</span>
      <span class="right">${starsHTML(r.stars)}</span></div>
    <div class="matchup">${teamCell(r, "away")}<div class="vs">${g.neutral ? "vs" : "at"}</div>${teamCell(r, "home")}</div>
    <div class="rootfor">${root}</div>
    ${body}
  </article>`;
}

function renderSummary(res) {
  const f = fan(), t = T(state.team);
  const suffer = FanScore.sufferList(IX, f, state.week);
  const tally = res.tally.won + res.tally.lost
    ? `<div>Your week so far: <b>${res.tally.won}-${res.tally.lost}</b> in games you cared about.</div>` : "";
  const sufferHTML = suffer.length ? suffer.map((s) => {
    const opp = s.game.home === s.rival ? s.game.away : s.game.home;
    const done = s.game.done && s.game.winner;
    const out = done ? (s.game.winner === s.rival ? `<span class="tag lost">survived</span>` : `<span class="tag won">suffered 😈</span>`) : `<span class="muted">${FanScore.pct(s.pLose)} chance</span>`;
    return `<div class="it">${logo(s.rival)}<b>${rankName(s.rival)}</b> vs ${rankName(opp)} · ${out} · pain ${starsHTML(FanScore.toStars(s.pain, FanScore.STAR_STEPS.rivals))}
      <span class="small muted">${esc(s.why.join("; "))}</span></div>`;
  }).join("") : `<div class="muted small">None of your rivals play this week.</div>`;
  $("#summary").innerHTML = `<div class="row" style="gap:10px">${logo(state.team)}<b>${esc(t.name)}</b><span class="muted">${rec(state.team)}${t.rank ? " · No. " + t.rank + " " + esc(DATA.poll.poll || "") : ""}</span></div>
    ${tally}<div style="margin-top:8px"><b>😈 Watch them suffer</b><div class="suffer">${sufferHTML}</div></div>`;
}

function renderTune() {
  const mine = rivalsFor(state.team);
  $("#rivals").innerHTML = mine.length ? mine.map((id) => `<span class="chip">${esc(tname(id))}<button data-rm="${esc(id)}" aria-label="Remove ${esc(tname(id))}">✕</button></span>`).join("")
    : `<span class="muted small">No rivals. Add one below.</span>`;
  const options = DATA.teams.filter((t) => t.conf && t.id !== state.team && !mine.includes(t.id) && t.name)
    .sort((a, b) => a.short.localeCompare(b.short));
  $("#addRival").innerHTML = `<option value="">Add a rival…</option>` + options.map((t) => `<option value="${esc(t.id)}">${esc(t.short)}</option>`).join("");
  const W = weights();
  $("#weights").innerHTML = FanScore.SIGNALS.map((s) => `<label for="w-${s.key}">${esc(s.label)}${s.soft ? " (soft)" : ""}</label>
    <input type="range" id="w-${s.key}" data-w="${s.key}" min="0" max="2" step="0.1" value="${W[s.key]}"><span class="small">${W[s.key].toFixed(1)}</span>`).join("");
}

function render() {
  const res = FanScore.scoreWeek(IX, fan(), state.week);
  renderSummary(res);
  const rows = res.rows.filter((r) => r.mine || r.stars >= 0.5);
  const shown = state.showAll ? res.rows : rows.slice(0, 12);
  $("#feed").innerHTML = `<h2 style="font-size:16px;margin:16px 0 8px">Your top games, week ${state.week}</h2>` + shown.map(card).join("") +
    (shown.length < res.rows.length ? `<button class="more" id="more">Show all ${res.rows.length} games</button>` : "");
  document.querySelectorAll("#styles button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.style === state.style));
  document.querySelectorAll("#weeks button").forEach((b) => b.setAttribute("aria-pressed", +b.dataset.week === state.week));
}

function setTeam(tid) {
  state.team = tid;
  state.showAll = false;
  store.set("team", tid);
  const t = T(tid);
  if (t.abbr) history.replaceState(null, "", "#" + encodeURIComponent(t.abbr));
  $("#team").value = tid;
  renderTune();
  render();
}

async function boot() {
  const [d, rv] = await Promise.all([fetch("data.json", { cache: "no-cache" }).then((r) => r.json()), fetch("rivals.json").then((r) => r.json())]);
  DATA = d; RIVALS = rv; IX = FanScore.index(d);
  const byConf = {};
  for (const t of d.teams.filter((t) => t.pickable)) (byConf[t.conf] ||= []).push(t);
  $("#team").innerHTML = Object.entries(byConf).sort((a, b) => (d.confs[a[0]] || {}).name.localeCompare((d.confs[b[0]] || {}).name))
    .map(([c, ts]) => `<optgroup label="${esc(c === "18" ? "Independent" : (d.confs[c] || {}).name)}">` +
      ts.sort((a, b) => a.short.localeCompare(b.short)).map((t) => `<option value="${esc(t.id)}">${esc(t.short)}</option>`).join("") + `</optgroup>`).join("");
  const weeks = [d.week, d.week + 1].filter((w) => d.games.some((g) => g.week === w));
  state.week = weeks[0];
  $("#weeks").innerHTML = weeks.map((w) => `<button data-week="${w}">Week ${w}</button>`).join("");
  if (d.fixture) $("#banner").innerHTML = `<div class="banner">Test data: built offline from Title Paths' published files on ${esc(d.fetchedAt)}. Week ${d.week + 1} odds partly estimated from FPI.</div>`;
  $("#foot").innerHTML = `Odds: ESPN's matchup predictor (or FPI). Conference odds: <a href="https://titlepaths.com/">Title Paths</a>. Rankings: ${esc(d.poll.poll || "none yet")}.
    Rankings, résumé and reputation signals are estimates, not proofs. Updated ${esc(new Date(d.fetchedAt.replace("Z", ":00Z")).toLocaleString())}.`;
  const fromHash = IX.byAbbr.get(decodeURIComponent(location.hash.slice(1)));
  const saved = store.get("team", null);
  setTeam(fromHash || (IX.teams.has(saved) ? saved : d.teams.find((t) => t.pickable).id));
}

window.addEventListener("hashchange", () => {
  const id = IX && IX.byAbbr.get(decodeURIComponent(location.hash.slice(1)));
  if (id && id !== state.team) setTeam(id);
});
$("#team").addEventListener("change", (e) => setTeam(e.target.value));
$("#weeks").addEventListener("click", (e) => { const w = e.target.dataset.week; if (w) { state.week = +w; state.showAll = false; render(); } });
$("#styles").addEventListener("click", (e) => { const s = e.target.dataset.style; if (s) { state.style = s; store.set("style", s); render(); } });
$("#feed").addEventListener("click", (e) => { if (e.target.id === "more") { state.showAll = true; render(); } });
$("#rivals").addEventListener("click", (e) => {
  const id = e.target.dataset.rm; if (!id) return;
  store.set("rivals." + state.team, rivalsFor(state.team).filter((x) => x !== id)); renderTune(); render();
});
$("#addRival").addEventListener("change", (e) => {
  if (!e.target.value) return;
  store.set("rivals." + state.team, [...rivalsFor(state.team), e.target.value]); renderTune(); render();
});
$("#resetRivals").addEventListener("click", () => { try { localStorage.removeItem("rg.rivals." + state.team); } catch {} renderTune(); render(); });
$("#weights").addEventListener("input", (e) => {
  const k = e.target.dataset.w; if (!k) return;
  store.set("weights", { ...store.get("weights", {}), [k]: +e.target.value });
  e.target.nextElementSibling.textContent = (+e.target.value).toFixed(1); render();
});
$("#resetWeights").addEventListener("click", () => { store.set("weights", {}); renderTune(); render(); });
boot().catch((e) => { $("#feed").textContent = "Couldn't load this week's data: " + e.message; });
</script>
</body>
</html>
