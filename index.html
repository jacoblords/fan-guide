<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gameday Guide</title>
<meta name="description" content="Pick your team: this week's college football games that matter to you, who to root for, and why.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #f3f4f7; --card: #ffffff; --ink: #141820; --muted: #5d6576; --faint: #8a91a0; --line: #d9dde5;
    --good: #11795a; --bad: #b8322a; --warn: #865b0e; --accent: #1c48c9; --chip: #e9ebf0;
    --star: #d39b00; --star-off: #d3d7df; --live: #b8322a;
    --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1016; --card: #151a22; --ink: #e7eaf0; --muted: #97a0b1; --faint: #6b7383; --line: #29303c;
      --good: #44c99a; --bad: #ff8173; --warn: #e2b553; --accent: #85a6ff; --chip: #1c222c;
      --star: #f2c14e; --star-off: #343b47; --live: #ff8173; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1016; --card: #151a22; --ink: #e7eaf0; --muted: #97a0b1; --faint: #6b7383; --line: #29303c;
    --good: #44c99a; --bad: #ff8173; --warn: #e2b553; --accent: #85a6ff; --chip: #1c222c;
    --star: #f2c14e; --star-off: #343b47; --live: #ff8173; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  img.logo-dark { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) img.logo-light { display: none; }
    :root:not([data-theme="light"]) img.logo-dark { display: inline; }
  }
  :root[data-theme="dark"] img.logo-light { display: none; }
  :root[data-theme="dark"] img.logo-dark { display: inline; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); }
  a { color: var(--accent); }
  button, select { font: inherit; color: inherit; }
  header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .bar { max-width: 720px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 10px; }
  .brand { font-family: var(--display); font-weight: 700; font-size: 21px; text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap; }
  .picker { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 6px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); min-width: 0; }
  .picker { cursor: pointer; font: inherit; color: inherit; }
  .picker-wrap { position: relative; min-width: 0; }
  .pop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; width: 320px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: 0 10px 30px rgb(0 0 0 / 0.15); padding: 8px; display: grid; gap: 6px; }
  .pop[hidden], .whybody[hidden] { display: none; }
  .pop input { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  .pop input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #pickList { max-height: min(60vh, 440px); overflow: auto; }
  .opt-h { font-family: var(--display); font-weight: 600; font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 8px 8px 2px; }
  .opt { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .opt img.logo { width: 22px; height: 22px; }
  .opt .meta2 { font-size: 12px; color: var(--muted); }
  .opt[aria-selected="true"] { background: var(--chip); }
  .opt.current .nm2 { font-weight: 700; }
  .opt-none { padding: 10px 8px; color: var(--muted); font-size: 13.5px; }
  .picker .nm { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { margin-left: auto; border: 1px solid var(--line); background: var(--card); border-radius: 999px; width: 34px; height: 34px; cursor: pointer; flex: none; }
  main { max-width: 1240px; margin: 0 auto; padding: 16px 16px 64px; }
  .bar { max-width: 1240px; }

  /* Layout, like Title Paths' gameday: this week beside your game, then card grids for live
     and must-watch games, the radar groups as cards side by side, and finals in two columns. */
  .layout { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); column-gap: 16px;
    grid-template-areas: "hero mine" "live live" "must must" "groups groups" "final final"; }
  .side, .body { display: contents; }
  #hero { grid-area: hero; } #mine { grid-area: mine; } #live { grid-area: live; }
  #must { grid-area: must; } #groups { grid-area: groups; } #final { grid-area: final; }
  #mine h2 { display: none; }
  #mine .card { height: 100%; margin: 0; }
  .layout:has(#mine:empty) #hero { grid-column: 1 / -1; } /* your game is live, up in Live now */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .cards .card { margin: 0; }
  .groupgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; align-items: start; }
  .groupgrid details.group { margin: 0; }
  .finals { padding: 0; overflow: hidden; display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); }
  .finals .rowg { border-top: 0; border-bottom: 1px solid var(--line); margin-bottom: -1px; }

  /* Phones: one column, in reading order. */
  @media (max-width: 760px) {
    .layout { display: flex; flex-direction: column; }
    #hero { order: 1; } #live { order: 2; } #mine { order: 3; } #must { order: 4; } #groups { order: 5; } #final { order: 6; }
    #mine h2 { display: flex; }
    .groupgrid { grid-template-columns: minmax(0, 1fr); }
  }
  img.logo { width: 28px; height: 28px; object-fit: contain; flex: none; }
  img.logo.sm { width: 20px; height: 20px; }
  img.logo.lg { width: 44px; height: 44px; }
  h2 { font-family: var(--display); font-size: 15px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin: 22px 0 8px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }

  /* This week */
  .hero { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px 16px; }
  .weeknav { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .wk-l { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; font-size: 12px; margin-right: 3px; }
  .wk { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); cursor: pointer; font: 600 13px var(--body); color: var(--ink); padding: 0; font-variant-numeric: tabular-nums; }
  .wk:hover { border-color: var(--muted); }
  .wk.now { box-shadow: inset 0 0 0 2px var(--accent); border-color: var(--accent); }
  .wk[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .wk-d { margin-left: 4px; }
  .hero .top { display: flex; gap: 12px; align-items: flex-start; }
  .stake { font-size: 19px; font-weight: 600; line-height: 1.3; margin: 0; text-wrap: balance; }
  .pull { font-size: 16px; margin: 8px 0 0; }
  .pull b { font-weight: 700; }
  .talk { margin: 10px 0 0; padding-top: 10px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .tally { display: inline-block; margin-top: 10px; font-size: 13px; font-weight: 600; background: var(--chip); border-radius: 999px; padding: 2px 10px; }

  /* Cards */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; display: grid; gap: 10px; align-content: start; }
  .card > * { margin: 0; }
  .verdict { border-left: 3px solid var(--pick); background: color-mix(in srgb, var(--pick) 7%, transparent); border-radius: 0 8px 8px 0; padding: 7px 10px 8px; }
  .verdict .root { margin: 0; }
  .trow .odds { font-size: 13px; font-weight: 500; color: var(--muted); }
  .cfoot { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding-top: 9px; margin-top: auto; }
  .cfoot .links { margin: 0; }
  .whybtn { border: 0; background: none; padding: 0; cursor: pointer; font-size: 13px; color: var(--accent); }
  .whybtn::after { content: " ▾"; }
  .whybtn[aria-expanded="true"]::after { content: " ▴"; }
  .whybody { margin-top: -2px; }
  .whybody .tug { margin-top: 0; }
  .card.mine { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .meta { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .meta .left { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
  .meta .pill { white-space: nowrap; }
  .meta .right { margin-left: auto; }
  .teams { display: grid; gap: 6px; }
  .trow { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-weight: 600; }
  .trow img.logo { width: 24px; height: 24px; }
  .trow .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trow .rk { color: var(--muted); font-size: 12px; font-weight: 500; margin-right: 4px; font-variant-numeric: tabular-nums; }
  .trow .rec { color: var(--faint); font-size: 12px; font-weight: 500; margin-left: 6px; }
  .trow .sc { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 16px; color: var(--muted); min-width: 2ch; text-align: right; }
  .trow.ahead .sc, .trow.won .sc { color: var(--ink); font-weight: 700; }
  .trow.lost { color: var(--muted); }
  .trow.lost img.logo { opacity: 0.6; }
  .trow .you { font-size: 11px; font-weight: 700; color: var(--good); margin-left: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  .root { font-size: 15.5px; margin-top: 4px; }
  .root b { font-weight: 750; }
  .reason { color: var(--muted); font-size: 14px; }
  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 650; border-radius: 999px; padding: 1px 8px; background: var(--chip); color: var(--muted); }
  .pill.big { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .pill.split { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .pill.yes { color: var(--good); background: color-mix(in srgb, var(--good) 15%, transparent); }
  .pill.no { color: var(--bad); background: color-mix(in srgb, var(--bad) 13%, transparent); }
  .pill.live { color: #fff; background: var(--live); }
  .stars { white-space: nowrap; letter-spacing: 0.5px; font-size: 13px; }
  .stars .on { color: var(--star); } .stars .off { color: var(--star-off); }
  .stars .half { background: linear-gradient(90deg, var(--star) 50%, var(--star-off) 50%); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .splitline { font-size: 13px; margin: 0 0 4px; color: var(--warn); line-height: 1.4; }
  .tug { display: grid; grid-template-columns: auto minmax(60px, 1fr); gap: 4px 10px; align-items: center; margin-top: 8px; font-size: 13px; }
  .tug .ends { grid-column: 2; display: flex; justify-content: space-between; font-size: 11.5px; color: var(--faint); }
  .tug .lab { font-weight: 600; }
  .tug .track { position: relative; height: 10px; border-radius: 5px; background: var(--chip); }
  .tug .track::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1.5px; background: var(--faint); }
  .tug .fill { position: absolute; top: 1px; bottom: 1px; border-radius: 4px; }
  .tug .det { grid-column: 1 / -1; color: var(--muted); font-size: 12.5px; line-height: 1.4; margin: 0 0 8px; }
  .tug .det:last-child { margin-bottom: 0; }
  .facts { margin-top: 6px; font-size: 12.5px; color: var(--muted); }

  /* In-game win probability, drawn like Title Paths' (and ESPN's) */
  .wp { display: grid; gap: 2px; }
  .wp-lab { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .wp-lab b { color: var(--ink); font-weight: 600; }
  .wp svg { display: block; width: 100%; height: 64px; border-block: 1px dotted var(--line); }
  .wp .q { stroke: var(--line); stroke-dasharray: 2 3; vector-effect: non-scaling-stroke; }
  .wp .m { stroke: var(--muted); vector-effect: non-scaling-stroke; }
  .wp .f { opacity: 0.3; }
  .wp .l { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .wp-q { position: relative; height: 1.2em; font-size: 11px; color: var(--muted); }
  .wp-q span { position: absolute; transform: translateX(-50%); }
  .links { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; }

  /* Live */
  .card.live { border-color: color-mix(in srgb, var(--live) 45%, var(--line)); }
  .climb { font-size: 11.5px; font-weight: 650; color: var(--live); margin-right: 4px; }
  .hotline { font-size: 13.5px; font-weight: 650; color: var(--live); margin-top: 2px; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--live) 55%, transparent); } 100% { box-shadow: 0 0 0 12px transparent; } }
  .card.hot { animation: pulse 1.4s ease-out 2; }
  @media (prefers-reduced-motion: reduce) { .card.hot { animation: none; } }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); display: inline-block; }

  /* Groups and compact rows */
  details.group { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 8px; }
  details.group > summary { list-style: none; cursor: pointer; padding: 10px 14px; display: flex; gap: 8px; align-items: baseline; }
  details.group > summary::-webkit-details-marker { display: none; }
  details.group > summary .gname { font-weight: 650; }
  details.group > summary .tagline { color: var(--muted); font-size: 13.5px; flex: 1; }
  .groupgrid details.group > summary { flex-wrap: wrap; position: relative; padding-right: 30px; }
  .groupgrid details.group > summary .tagline { flex-basis: 100%; font-size: 13px; }
  .groupgrid details.group > summary::after { position: absolute; right: 14px; top: 11px; }
  details.group > summary::after { content: "▾"; color: var(--faint); }
  details.group[open] > summary::after { content: "▴"; }
  details.routine { border-top: 1px solid var(--line); }
  details.routine > summary { list-style: none; cursor: pointer; padding: 9px 14px; font-size: 13px; color: var(--accent); }
  details.routine > summary::-webkit-details-marker { display: none; }
  details.routine > summary::after { content: " ▾"; }
  details.routine[open] > summary::after { content: " ▴"; }
  .rowg { border-top: 1px solid var(--line); padding: 8px 14px; }
  .rowg .l1 { display: flex; gap: 8px; align-items: center; font-size: 14px; }
  .rowg .l1 .t { color: var(--faint); font-size: 12px; min-width: 82px; flex: none; white-space: nowrap; }
  .rowg .l1 .s { margin-left: auto; }
  .rowg .rk { color: var(--muted); font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .rowg .l2 { color: var(--muted); font-size: 13px; padding-left: 90px; }
  .final .l1 .res { font-weight: 650; }
  .final .won { color: var(--good); } .final .lost { color: var(--bad); }

  dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--ink); max-width: 520px; width: calc(100% - 32px); padding: 16px; }
  dialog::backdrop { background: rgba(0,0,0,0.35); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chip { display: inline-flex; align-items: center; gap: 4px; background: var(--chip); border-radius: 999px; padding: 3px 10px; font-size: 13.5px; }
  .chip button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 0 0 2px; }
  .weights { display: grid; grid-template-columns: 140px 1fr 30px; gap: 6px 10px; align-items: center; font-size: 14px; margin-top: 8px; }
  .btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  footer { margin-top: 28px; font-size: 12px; color: var(--faint); }
  .badge { display: inline-block; font-size: 11.5px; border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; margin-right: 6px; }

  @media (max-width: 520px) {
    .pop { position: fixed; left: 8px; right: 8px; top: 56px; width: auto; }
    .brand { display: none; }
    .stake { font-size: 17px; }
    .trow .rec { display: none; }
    .rowg .l2 { padding-left: 0; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="brand">Gameday Guide</span>
    <div class="picker-wrap">
      <button class="picker" id="pickBtn" aria-haspopup="listbox" aria-expanded="false" title="Pick your team (/)">
        <span id="pickLogo"></span><span class="nm" id="pickName">Pick a team</span><span class="muted">▾</span>
      </button>
      <div class="pop" id="pickPop" hidden>
        <input id="pickQ" type="search" placeholder="Search teams or conferences" autocomplete="off" spellcheck="false"
          role="combobox" aria-expanded="true" aria-controls="pickList" aria-autocomplete="list" aria-label="Search teams">
        <div id="pickList" role="listbox" aria-label="Teams"></div>
      </div>
    </div>
    <button class="icon-btn" id="gear" aria-label="Rivals and settings" title="Rivals and settings">⚙</button>
  </div>
</header>
<main>
  <div class="layout">
    <div class="side">
      <section class="hero" id="hero"></section>
      <div id="mine"></div>
      <div id="final"></div>
    </div>
    <div class="body">
      <div id="live"></div>
      <div id="must"></div>
      <div id="groups"></div>
    </div>
  </div>
  <footer id="foot"></footer>
</main>
<dialog id="tune">
  <form method="dialog" style="display:flex;justify-content:space-between;align-items:center">
    <b>Rivals</b><button class="btn">Done</button>
  </form>
  <div class="small muted">You root against these teams. Their losses, and games that hurt their title hopes, count for you.</div>
  <div class="chips" id="rivals"></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <select id="addRival" class="btn" aria-label="Add a rival"></select>
    <button class="btn" id="resetRivals">Reset to defaults</button>
  </div>
  <details style="margin-top:14px">
    <summary class="small" style="cursor:pointer">What counts most to you</summary>
    <div class="weights" id="weights"></div>
    <button class="btn" id="resetWeights" style="margin-top:8px">Reset</button>
  </details>
</dialog>
<script src="score.js"></script>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("rg." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("rg." + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem("rg." + k); } catch {} },
};
const params = new URLSearchParams(location.search);
let DATA, IX, RIVALS;
const state = { team: null, week: null, open: new Set() };

const rivalsFor = (tid) => store.get("rivals." + tid, null) || FanScore.defaultRivals(IX, RIVALS, tid);
const weights = () => ({ ...FanScore.DEFAULT_WEIGHTS, ...store.get("weights", {}) });
const fan = () => ({ team: state.team, rivals: rivalsFor(state.team), weights: weights(), rivalsOf: (r) => FanScore.defaultRivals(IX, RIVALS, r) });
const T = (id) => IX.teams.get(id) || { id, color: "#888" };
const nm = (id) => FanScore.name(IX, id);
// ESPN's dark-background logo in dark mode (some teams' regular logos vanish on a dark page).
const logo = (id, cls = "") => {
  const t = T(id);
  if (!t.logo) return `<span class="logo ${cls}" style="display:inline-block"></span>`;
  if (!t.logoDark || t.logoDark === t.logo) return `<img class="logo ${cls}" alt="" loading="lazy" src="${esc(t.logo)}">`;
  return `<img class="logo logo-light ${cls}" alt="" loading="lazy" src="${esc(t.logo)}"><img class="logo logo-dark ${cls}" alt="" loading="lazy" src="${esc(t.logoDark)}">`;
};
const rec = (id) => { const r = T(id).record; return r ? `${r[0]}-${r[1]}` : ""; };

function starsHTML(v) {
  if (v == null) return "";
  const n = Math.round(v * 2) / 2, full = Math.floor(n), half = n - full >= 0.5;
  return `<span class="stars" title="${n} of 5: how much this game matters to you" aria-label="${n} of 5 stars"><span class="on">${"★".repeat(full)}</span>${half ? '<span class="half">★</span>' : ""}<span class="off">${"★".repeat(5 - full - (half ? 1 : 0))}</span></span>`;
}
function kickoff(g, withDay = true) {
  const d = new Date(g.date);
  const day = d.toLocaleDateString(undefined, { weekday: "short" });
  if (g.timeValid === false) return withDay ? `${day} · TBA` : "TBA";
  const t = d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }).replace(":00", "").replace(" ", "");
  return withDay ? `${day} ${t}` : t;
}
const size = (s) => { const a = Math.abs(s); return a >= 4 ? "huge" : a >= 2.5 ? "big" : a >= 1 ? "some" : "a little"; };

// ---- cards ---------------------------------------------------------------------------------

// Away over home, as on Title Paths' gameday cards: logo, rank, name, record, and the score once
// the game is on. The leader's (or winner's) score is bold; a loser fades.
function teamsHTML(r) {
  const g = r.game, scored = (g.done && !g.canceled) || g.state === "in";
  const row = (side) => {
    const id = g[side], t = T(id), sc = side === "home" ? g.homeScore : g.awayScore, osc = side === "home" ? g.awayScore : g.homeScore;
    const cls = g.done && g.winner ? (g.winner === id ? "won" : "lost") : scored && sc > osc ? "ahead" : "";
    const you = r.pick === id ? `<span class="you">${r.mine ? "you" : "pick"}</span>` : "";
    const pSide = side === "home" ? r.p : 1 - r.p;
    const right = scored ? esc(sc) : pSide >= 0.5 ? `<span class="odds" title="ESPN's odds of winning">${FanScore.pct(pSide)}</span>` : "";
    return `<div class="trow ${cls}">${logo(id)}<span class="nm">${t.rank ? `<span class="rk">${esc(t.rank)}</span>` : ""}${esc(nm(id))}<span class="rec">${esc(rec(id))}</span>${you}</span><span class="sc">${right}</span></div>`;
  };
  return `<div class="teams">${row("away")}${row("home")}</div>`;
}

// ESPN's in-game win probability (g.wp.pts: [seconds from kickoff, home odds in thousandths]),
// drawn as Title Paths draws it: the away side on top, the home side below, shaded toward
// whoever leads in that team's color, with quarter lines.
function wpChart(g) {
  const pts = (g.wp && g.wp.pts) || [];
  if (pts.length < 2) return "";
  const W = 300, H = 80, mid = H / 2, tMax = Math.max(3600, pts[pts.length - 1][0]);
  const X = (t) => ((t / tMax) * W).toFixed(1), Y = (v) => ((Math.min(Math.max(v, 0), 1000) / 1000) * H).toFixed(1);
  const line = pts.map(([t, v]) => `${X(t)},${Y(v)}`).join(" ");
  const area = `0,${mid} ${line} ${X(pts[pts.length - 1][0])},${mid}`;
  const color = (id) => esc(T(id).color || "#888");
  const id = "wp" + String(g.id).replace(/[^0-9A-Za-z]/g, "");
  const quarters = [900, 1800, 2700].map((t) => `<line x1="${X(t)}" x2="${X(t)}" y1="0" y2="${H}" class="q"/>`).join("");
  const labels = ["1st", "2nd", "3rd", "4th"].map((q, n) => `<span style="left:${((n * 900 + 450) / tMax * 100).toFixed(1)}%">${q}</span>`).join("")
    + (tMax > 3600 ? `<span style="left:${((3600 + tMax) / 2 / tMax * 100).toFixed(1)}%">OT</span>` : "");
  const now = pts[pts.length - 1][1] / 1000;
  const lab = (tid, p) => `<div class="wp-lab"><span>${esc(T(tid).abbr || nm(tid))}</span><b>${FanScore.pct(p)}</b></div>`;
  return `<div class="wp" role="img" aria-label="ESPN win probability: ${esc(nm(g.away))} ${FanScore.pct(1 - now)}, ${esc(nm(g.home))} ${FanScore.pct(now)}">
    ${lab(g.away, 1 - now)}
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <defs><clipPath id="${id}a"><rect x="0" y="0" width="${W}" height="${mid}"/></clipPath><clipPath id="${id}h"><rect x="0" y="${mid}" width="${W}" height="${mid}"/></clipPath></defs>
      ${quarters}<line x1="0" x2="${W}" y1="${mid}" y2="${mid}" class="m"/>
      <polygon points="${area}" fill="${color(g.away)}" clip-path="url(#${id}a)" class="f"/>
      <polygon points="${area}" fill="${color(g.home)}" clip-path="url(#${id}h)" class="f"/>
      <polyline points="${line}" class="l"/>
    </svg>
    <div class="wp-q" aria-hidden="true">${labels}</div>
    ${lab(g.home, now)}</div>`;
}

// r/CFB's game threads are posted by u/CFB_Referee with full school names, while ESPN's short
// names abbreviate, so the search asks for the title words the names agree on (as Title Paths does).
function threadQuery(g) {
  const words = (id) => (T(id).short || "").split(/\s+/).filter((w) => w && !/^(st\.?|state)$/i.test(w) && /^[\p{L}\p{N}&'.-]+$/u.test(w));
  return ['author:CFB_Referee', 'title:"Game Thread"', ...[...words(g.away), ...words(g.home)].map((w) => "title:" + w)].join(" AND ");
}
function linksHTML(g) {
  const threadOpen = g.timeValid !== false && Date.now() >= new Date(g.date).getTime() - 2 * 3600e3;
  const q = `${nm(g.away)} ${nm(g.home)}`;
  return `<div class="links">
    <a href="https://www.espn.com/college-football/game/_/gameId/${encodeURIComponent(g.id)}" target="_blank" rel="noopener" title="ESPN Gamecast">ESPN</a>
    ${threadOpen ? `<a href="https://www.reddit.com/r/CFB/search/?q=${encodeURIComponent(threadQuery(g))}&amp;restrict_sr=1&amp;sort=new" target="_blank" rel="noopener" title="The r/CFB game thread">r/CFB</a>` : ""}
    <a href="https://x.com/search?q=${encodeURIComponent(q)}&amp;f=live" target="_blank" rel="noopener" title="Live posts on X">X</a></div>`;
}

function tugHTML(r) {
  const g = r.game, ca = T(g.away).color || "#888", ch = T(g.home).color || "#888";
  const rows = r.signals.filter((s) => !s.both).map((s) => {
    const w = Math.min(50, (Math.abs(s.stars) / 5) * 50);
    const toHome = s.stars > 0;
    const fill = toHome ? `left:50%;width:${w}%;background:${esc(ch)}` : `right:50%;width:${w}%;background:${esc(ca)}`;
    const tag = `${esc(nm(toHome ? g.home : g.away))}, ${size(s.stars)}`;
    return `<div class="lab">${esc(s.label)}</div><div class="track" role="img" aria-label="${esc(s.label)}: pulls toward ${tag}"><div class="fill" style="${fill}"></div></div>
      <div class="det">${esc(s.text)}${s.link ? ` · <a href="${esc(s.link)}" target="_blank" rel="noopener">title paths</a>` : ""}</div>`;
  }).join("");
  if (!rows) return "";
  return `<div class="tug"><div></div><div class="ends"><span>◀ ${esc(nm(g.away))}</span><span>${esc(nm(g.home))} ▶</span></div>${rows}</div>`;
}

function factsHTML(r) {
  const g = r.game;
  const fav = (p) => (p >= 0.5 ? [g.home, p] : [g.away, 1 - p]);
  let odds;
  if (g.state === "in" && r.pNow != null) {
    const [t, p] = fav(r.pNow);
    const was = t === g.home ? r.p : 1 - r.p;
    odds = `Now: ${esc(nm(t))} ${FanScore.pct(p)} to win (was ${FanScore.pct(was)})`;
  } else {
    const [t, p] = fav(r.p);
    odds = `${esc(nm(t))} ${FanScore.pct(p)} to win`;
  }
  return `<div class="facts">${odds}${g.spread && g.state !== "in" ? " · " + esc(g.spread) : ""}</div>`;
}

function cardHTML(r, opts = {}) {
  const g = r.game, live = g.state === "in", scored = live || (g.done && !g.canceled);
  const li = opts.live;
  const when = live ? `<span class="pill live">LIVE</span> ${esc(g.status || "")}` : g.done ? "Final" : esc(kickoff(g));
  const head = [when, g.tv && !g.done ? esc(g.tv) : "", g.spread && !scored ? esc(g.spread) : ""].filter(Boolean).join(" · ");
  let root;
  if (r.mine) root = `Go <b>${esc(nm(r.pick))}</b>`;
  else if (r.pick) root = `Root for <b>${esc(nm(r.pick))}</b>`;
  else root = `<span class="muted">No side to take</span>`;
  const going = li && li.going ? `<span class="pill ${li.going}">${li.going === "yes" ? "Going your way" : "Not going your way"}</span>` : "";
  const split = r.conflict ? `<span class="pill split" title="${esc(r.split || "Signals disagree")}">⇄ Split</span>` : "";
  const reason = r.reason ? `<div class="reason">${esc(r.reason)}${r.reason.endsWith(".") ? "" : "."}</div>` : "";
  const hot = li && li.why ? `<div class="hotline">${esc(li.why)}</div>` : "";
  const key = g.id, open = state.open.has(key);
  const why = r.signals.length
    ? `<button class="whybtn" data-why="${esc(key)}" aria-expanded="${open}">Why</button>` : "<span></span>";
  const whyBody = r.signals.length
    ? `<div class="whybody"${open ? "" : " hidden"}>${r.split ? `<div class="splitline">${esc(r.split)}</div>` : ""}${tugHTML(r)}</div>` : "";
  const tint = r.pick ? esc(T(r.pick).color || "#888") : "var(--line)";
  const biggest = opts.biggest ? `<span class="pill big">Biggest</span>` : "";
  const climb = li && li.climbed >= 1 ? `<span class="climb" title="Up from ${esc(r.preStars)} stars before kickoff">▲ was ${esc(r.preStars)}</span> ` : "";
  return `<article class="card ${r.mine ? "mine" : ""} ${live ? "live" : ""} ${opts.pulse ? "hot" : ""}">
    <div class="meta"><span class="left">${head} ${biggest}${going}${split}</span><span class="right">${climb}${starsHTML(r.stars)}</span></div>
    ${teamsHTML(r)}
    ${hot}
    <div class="verdict" style="--pick:${tint}"><div class="root">${root}</div>${reason}</div>
    ${live && g.wp ? wpChart(g) : live ? factsHTML(r) : ""}
    <div class="cfoot">${why}${scored || r.mine || (r.stars || 0) >= 3 ? linksHTML(g) : ""}</div>
    ${whyBody}
  </article>`;
}

const rkName = (id) => { const t = T(id); return (t.rank ? `<span class="rk">${esc(t.rank)}</span> ` : "") + esc(nm(id)); };

function compactHTML(r) {
  const g = r.game;
  const other = r.pick === g.home ? g.away : g.home;
  const named = r.pick && (T(r.pick).short || T(r.pick).name);
  const line = !r.pick ? `${rkName(g.away)} at ${rkName(g.home)}`
    : named ? `Root for <b>${rkName(r.pick)}</b> over ${rkName(other)}` : `Root against <b>${rkName(other)}</b>`;
  const when = g.state === "in" ? `<b style="color:var(--live)">${esc(T(g.away).abbr || "")} ${esc(g.awayScore)}-${esc(g.homeScore)} ${esc(T(g.home).abbr || "")}</b>` : esc(kickoff(g));
  return `<div class="rowg"><div class="l1"><span class="t">${when}</span>${r.pick ? logo(r.pick, "sm") : ""}<span>${line}</span>${r.conflict ? '<span class="pill split" title="' + esc(r.split || "") + '">⇄</span>' : ""}<span class="s">${starsHTML(r.stars)}</span></div>
    <div class="l2">${esc(r.reason || "")}</div></div>`;
}

function finalHTML(r) {
  const g = r.game;
  const w = g.winner, l = w === g.home ? g.away : g.home;
  const ws = w === g.home ? g.homeScore : g.awayScore, ls = w === g.home ? g.awayScore : g.homeScore;
  const res = r.mine ? (w === state.team ? "won" : "lost") : r.result;
  const mark = res === "won" ? "✓" : res === "lost" ? "✗" : "·";
  return `<div class="rowg final"><div class="l1"><span class="res ${res || ""}">${mark}</span>${logo(w, "sm")}<span><b>${rkName(w)}</b> beat ${rkName(l)} ${esc(ws)}-${esc(ls)}</span><span class="s">${starsHTML(r.stars)}</span></div>
    <div class="l2">${res === "won" ? "Went your way" : res === "lost" ? "Didn't go your way" : ""}${r.reason ? (res ? ". " : "") + esc(r.reason) : ""}</div></div>`;
}

const GROUP_TAGLINES = {
  conf: "Results that shape your conference title race",
  rank: "Ranked matchups near you",
  resume: "The better they do, the better your record looks",
  rivals: "Games that could hurt your rivals",
  rep: "Your conference against other leagues",
};

function render() {
  const f = fan();
  const { rows, tally } = FanScore.scoreWeek(IX, f, state.week);
  const h = FanScore.headline(IX, f, state.week, rows);
  const cal = (DATA.calendar || []).find((c) => c.week === state.week);
  const range = cal ? new Date(cal.start.replace("Z", ":00Z")).toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "";
  const weeks = [...new Set(DATA.games.map((g) => g.week))].sort((a, b) => a - b);
  const pullHTML = esc(h.pull).replace(/(Beat |pull for |Pull for )([^,.]+)/g, (m, a, b) => a + "<b>" + b + "</b>").replace(/(, |and )([A-Z][^,.]*?)(?=,| and|\.)/g, (m, a, b) => (b.startsWith("<b>") || b.startsWith("pull") ? m : a + "<b>" + b + "</b>"));
  // Week buttons, as on Title Paths' gameday: this week ringed, the one shown filled.
  const chips = weeks.map((w) => `<button data-week="${w}" class="wk${w === DATA.week ? " now" : ""}" aria-pressed="${w === state.week}"${w === DATA.week ? ' title="This week"' : ""}>${w}</button>`).join("");
  $("#hero").innerHTML = `<div class="weeknav" role="group" aria-label="Week"><span class="wk-l">Week</span>${chips}<span class="wk-d">${range ? "from " + esc(range) : ""}</span></div>
    <div class="top">${logo(state.team, "lg")}<div><p class="stake">${esc(h.stake)}</p>${h.pull ? `<p class="pull">${pullHTML}</p>` : ""}</div></div>
    ${h.talk ? `<p class="talk">💬 ${esc(h.talk)}</p>` : ""}
    ${tally.won + tally.lost ? `<span class="tally">Your week so far: ${tally.won}-${tally.lost}</span>` : ""}`;

  const isLive = (r) => r.game.state === "in";
  const isFinal = (r) => r.game.done && !r.game.canceled && r.game.winner;

  // Live now. A game's stars are re-scored with the live odds, so a radar game whose upset is
  // starting to happen climbs past 2 stars and moves up here; at most three such climbers at
  // once, ordered by live interest, and at most one card pulses.
  const live = rows.filter(isLive).map((r) => ({ r, li: FanScore.liveInterest(IX, r) })).filter((x) => x.li)
    .filter((x) => x.r.mine || (x.r.stars || 0) >= 2)
    .sort((a, b) => b.li.score - a.li.score);
  const climbers = live.filter((x) => !x.r.mine && (x.r.preStars || 0) < 2).slice(0, 3);
  const liveShown = live.filter((x) => x.r.mine || (x.r.preStars || 0) >= 2 || climbers.includes(x)).slice(0, 8);
  const pulseId = liveShown.find((x) => x.li.hot)?.r.game.id;
  const shownIds = new Set(liveShown.map((x) => x.r.game.id));
  // Live games that didn't make the strip stay where they were, with their score.
  const upcoming = rows.filter((r) => !isFinal(r) && !shownIds.has(r.game.id));
  $("#live").innerHTML = liveShown.length
    ? `<h2><span class="dot"></span> Live now</h2><div class="cards">` + liveShown.map((x) => cardHTML(x.r, { live: x.li, pulse: x.r.game.id === pulseId })).join("") + `</div>` : "";

  const mine = upcoming.find((r) => r.mine);
  $("#mine").innerHTML = mine ? `<h2>Your game</h2>` + cardHTML(mine) : "";

  const others = upcoming.filter((r) => !r.mine && r.stars >= 1);
  // Must-watch: the top games, but no more than two from any one group, so the playoff ladder
  // doesn't crowd out everything else.
  const perGroup = {};
  const must = others.filter((r) => r.stars >= 3 && !r.routine && (perGroup[r.group] = (perGroup[r.group] || 0) + 1) <= 2).slice(0, 5);
  const mustSorted = [...must].sort((a, b) => a.game.date.localeCompare(b.game.date));
  $("#must").innerHTML = must.length ? `<h2>Must-watch</h2><div class="cards">` + mustSorted.map((r) => cardHTML(r, { biggest: (h.biggest || []).includes(r.game.id) })).join("") + `</div>` : "";

  const rest = others.filter((r) => !must.includes(r));
  const groups = {};
  for (const r of rest) (groups[r.group] ||= []).push(r);
  const order = ["conf", "rank", "rivals", "resume", "rep"];
  // Radar groups start open, as cards side by side (on a phone too: they're short).
  $("#groups").innerHTML = rest.length ? `<h2>Also on your radar</h2><div class="groupgrid">` + order.filter((k) => groups[k]).map((k) => {
    const list = groups[k].sort((a, b) => a.game.date.localeCompare(b.game.date));
    const sig = FanScore.SIGNALS.find((s) => s.key === k);
    const open = !state.open.has("closed:" + k);
    // Routine ladder games (a ranked favorite against an unranked team) fold away.
    const shown = list.filter((r) => !r.routine), routine = list.filter((r) => r.routine);
    const count = shown.length ? `${shown.length} game${shown.length > 1 ? "s" : ""}` : "nothing close this week";
    const quiet = routine.length
      ? `<details class="routine" data-g="routine-${k}"${state.open.has("g:routine-" + k) ? " open" : ""}><summary>${shown.length ? "" : "No ranked matchups near you. "}Show ${routine.length} routine game${routine.length > 1 ? "s" : ""}</summary>${routine.map(compactHTML).join("")}</details>` : "";
    return `<details class="group" data-g="${k}"${open ? " open" : ""}><summary><span class="gname">${esc(sig.group)}</span><span class="tagline">${esc(GROUP_TAGLINES[k])} · ${count}</span></summary>${shown.map(compactHTML).join("")}${quiet}</details>`;
  }).join("") + `</div>` : "";

  const finals = rows.filter(isFinal).filter((r) => r.mine || (r.stars || 0) >= 1).sort((a, b) => b.game.date.localeCompare(a.game.date));
  $("#final").innerHTML = finals.length ? `<h2>Final</h2><div class="card finals">${finals.map(finalHTML).join("")}</div>` : "";
}

function renderPicker() {
  const t = T(state.team);
  $("#pickLogo").innerHTML = logo(state.team, "sm");
  $("#pickName").textContent = t.short || t.name || "Pick a team";
}

// Team picker: search by team, abbreviation or conference; the teams picked most recently come
// first. Arrow keys move, Enter picks, Escape closes; "/" opens it from anywhere on the page.
const RECENT_MAX = 6;
const recentTeams = () => store.get("recent", []).filter((id) => IX && IX.teams.has(id) && T(id).pickable);
const confName = (c) => (c === "18" ? "Independent" : ((DATA && DATA.confs[c]) || {}).name || "");
const fold = (x) => String(x || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9&]+/g, " ").trim();
const picker = { active: 0, ids: [] };

function pickerMatches(q) {
  const teams = DATA.teams.filter((t) => t.pickable);
  if (!q) return null;
  const words = fold(q).split(" ");
  const scored = [];
  for (const t of teams) {
    const hay = [t.short, t.name, t.school, t.abbr, confName(t.conf)].map(fold);
    if (!words.every((w) => hay.some((h) => h.includes(w)))) continue;
    // Best first: the name or abbreviation starts with the query, then a word in the name does.
    const f = fold(q);
    const rank = fold(t.abbr) === f || fold(t.short).startsWith(f) ? 0 : hay.slice(0, 3).some((h) => h.split(" ").some((w) => w.startsWith(words[0]))) ? 1 : 2;
    scored.push([rank, t]);
  }
  return scored.sort((a, b) => a[0] - b[0] || a[1].short.localeCompare(b[1].short)).map((x) => x[1]);
}

function renderPickList() {
  const q = $("#pickQ").value.trim();
  const opt = (t) => `<div class="opt${t.id === state.team ? " current" : ""}" role="option" id="opt-${esc(t.id)}" data-id="${esc(t.id)}" aria-selected="false">
    ${logo(t.id)}<span class="nm2">${t.rank ? `<span class="muted small">${esc(t.rank)}</span> ` : ""}${esc(t.short)}</span><span class="meta2">${esc(confName(t.conf))}</span></div>`;
  let html = "", ids = [];
  const matches = pickerMatches(q);
  if (matches) {
    ids = matches.map((t) => t.id);
    html = matches.length ? matches.map(opt).join("") : `<div class="opt-none">No team matches “${esc(q)}”.</div>`;
  } else {
    const recent = recentTeams();
    if (recent.length) {
      html += `<div class="opt-h">Recent</div>` + recent.map((id) => opt(T(id))).join("");
      ids.push(...recent);
    }
    const byConf = {};
    for (const t of DATA.teams.filter((t) => t.pickable)) (byConf[t.conf] ||= []).push(t);
    for (const c of Object.keys(byConf).sort((a, b) => confName(a).localeCompare(confName(b)))) {
      const list = byConf[c].sort((a, b) => a.short.localeCompare(b.short));
      html += `<div class="opt-h">${esc(confName(c))}</div>` + list.map(opt).join("");
      ids.push(...list.map((t) => t.id));
    }
  }
  $("#pickList").innerHTML = html;
  picker.ids = ids;
  setActive(q ? 0 : Math.max(0, ids.indexOf(state.team)));
}

function setActive(i) {
  const opts = [...document.querySelectorAll("#pickList .opt")];
  if (!opts.length) { $("#pickQ").removeAttribute("aria-activedescendant"); return; }
  picker.active = Math.max(0, Math.min(i, opts.length - 1));
  opts.forEach((o, k) => o.setAttribute("aria-selected", k === picker.active));
  const el = opts[picker.active];
  $("#pickQ").setAttribute("aria-activedescendant", el.id);
  el.scrollIntoView({ block: "nearest" });
}

function openPicker() {
  $("#pickPop").hidden = false;
  $("#pickBtn").setAttribute("aria-expanded", "true");
  $("#pickQ").value = "";
  renderPickList();
  $("#pickQ").focus();
}
function closePicker(focusButton) {
  if ($("#pickPop").hidden) return;
  // Never leave focus in the hidden search box, or typing would go into it unseen.
  const inside = $("#pickPop").contains(document.activeElement);
  $("#pickPop").hidden = true;
  $("#pickBtn").setAttribute("aria-expanded", "false");
  $("#pickQ").value = "";
  if (focusButton || inside) $("#pickBtn").focus();
}
function choose(id) {
  closePicker(true);
  if (id && id !== state.team) pickTeam(id);
}

function renderTune() {
  const mine = rivalsFor(state.team);
  $("#rivals").innerHTML = mine.length ? mine.map((id) => `<span class="chip">${logo(id, "sm")}${esc(nm(id))}<button data-rm="${esc(id)}" aria-label="Remove ${esc(nm(id))}">✕</button></span>`).join("")
    : `<span class="muted small">No rivals yet.</span>`;
  const options = DATA.teams.filter((t) => t.conf && t.name && t.id !== state.team && !mine.includes(t.id)).sort((a, b) => a.short.localeCompare(b.short));
  $("#addRival").innerHTML = `<option value="">Add a rival…</option>` + options.map((t) => `<option value="${esc(t.id)}">${esc(t.short)}</option>`).join("");
  const W = weights();
  $("#weights").innerHTML = FanScore.SIGNALS.map((s) => `<label for="w-${s.key}">${esc(s.label)}</label>
    <input type="range" id="w-${s.key}" data-w="${s.key}" min="0" max="2" step="0.1" value="${W[s.key]}"><span class="small">${W[s.key].toFixed(1)}</span>`).join("");
}

function setTeam(tid) {
  state.team = tid;
  state.open.clear();
  store.set("team", tid);
  store.set("recent", [tid, ...store.get("recent", []).filter((x) => x !== tid)].slice(0, RECENT_MAX));
  const t = T(tid);
  if (t.abbr) history.replaceState(null, "", location.search + "#" + encodeURIComponent(t.abbr));
  renderPicker();
  renderTune();
  render();
}

// Demo: a made-up Saturday built around the picked team, to see the game-day layout. Its own
// game is live and close; its top-rated games are under way (one with the underdog leading late);
// a ranked heavy favorite it doesn't care much about trails late, to show a game climbing into
// Live now; and a few of its next games are already final (two went its way, one didn't).
function demoLive(d, rv, team) {
  const ix = FanScore.index(d);
  const hash = (s) => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
  const fan = { team, rivals: FanScore.defaultRivals(ix, rv, team), rivalsOf: (r) => FanScore.defaultRivals(ix, rv, r) };
  const rows = FanScore.scoreWeek(ix, fan, d.week).rows.filter((r) => !r.game.done);
  const favOf = (g) => (FanScore.pHome(ix, g) >= 0.5 ? "home" : "away");
  const live = (g, period, lead) => { // lead: points the favorite leads by (negative: the underdog leads)
    const h = hash(g.id), fav = favOf(g), clock = `${1 + (h % 14)}:${String(h % 60).padStart(2, "0")}`;
    const base = 6 * period + (h % 7);
    const favScore = base + Math.max(lead, 0), dogScore = base + Math.max(-lead, 0);
    Object.assign(g, { state: "in", period, clock, status: `${clock} - ${["1st", "2nd", "3rd", "4th"][period - 1]}`,
      homeScore: fav === "home" ? favScore : dogScore, awayScore: fav === "home" ? dogScore : favScore, leadChanges: h % 6 });
    // A win-probability chart that wanders toward the estimate for the current score.
    const elapsed = (period - 1) * 900 + 900 - ((1 + (h % 14)) * 60 + (h % 60));
    const pts = [];
    for (let t = 0, k = 0; t <= elapsed; t += 90, k++) {
      const frac = t / Math.max(elapsed, 1);
      const m = Math.round((g.homeScore - g.awayScore) * frac + Math.sin(k * 1.7 + (h % 9)) * 4 * (1 - frac));
      const q = Math.min(4, 1 + Math.floor(t / 900)), left = 900 - (t % 900);
      const at = { ...g, period: q, clock: `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`, homeScore: Math.max(0, m), awayScore: Math.max(0, -m), wp: null };
      pts.push([t, Math.round(FanScore.liveP(ix, at) * 1000)]);
    }
    if (pts.length >= 2) g.wp = { pts, final: false };
  };
  const final = (g, winner) => {
    const h = hash(g.id), w = winner === g.home ? "home" : "away";
    const ws = 21 + (h % 21), ls = ws - 3 - (h % 14);
    Object.assign(g, { done: true, winner: g[w], homeScore: w === "home" ? ws : ls, awayScore: w === "home" ? ls : ws });
  };
  const used = new Set();
  const take = (r) => { used.add(r.game.id); return r.game; };
  const mine = rows.find((r) => r.mine);
  if (mine) live(take(mine), 3, 3);
  const top = rows.filter((r) => !r.mine && (r.stars || 0) >= 2).slice(0, 7);
  top.slice(0, 4).forEach((r, i) => live(take(r), 2 + (i % 3), i === 1 ? -6 : 4 + i * 3));
  // Two of the finals went your way, one didn't.
  top.slice(4, 7).forEach((r, i) => final(take(r), (i < 2) === (r.pick === r.game.home) ? r.game.home : r.game.away));
  const climber = rows.find((r) => !used.has(r.game.id) && (r.stars || 0) < 2 && r.stars > 0 && (() => {
    const p = FanScore.pHome(ix, r.game), fav = p >= 0.5 ? r.game.home : r.game.away;
    return Math.max(p, 1 - p) >= 0.75 && (ix.teams.get(fav) || {}).rank;
  })());
  if (climber) live(take(climber), 4, -5);
}

// Demo game day: from ?demo=live, or the footer's toggle (where the address can't carry it).
let demo = params.get("demo") === "live";

async function boot() {
  const [d, rv] = await Promise.all([fetch("data.json", { cache: "no-cache" }).then((r) => r.json()), fetch("rivals.json").then((r) => r.json())]);
  const pre = FanScore.index(d);
  const fromHash = pre.byAbbr.get(decodeURIComponent(location.hash.slice(1)));
  const saved = store.get("team", null);
  const team = (state.team && pre.teams.has(state.team) && state.team) || fromHash || (pre.teams.has(saved) ? saved : d.teams.find((t) => t.pickable).id);
  if (demo) demoLive(d, rv, team);
  DATA = d; RIVALS = rv; IX = FanScore.index(d);
  state.week = d.week;
  const updated = new Date(d.fetchedAt.replace("Z", ":00Z")).toLocaleString(undefined, { weekday: "short", hour: "numeric", minute: "2-digit" });
  $("#foot").innerHTML = `${d.fixture ? '<span class="badge">test data</span>' : ""}${demo ? '<span class="badge">demo scores</span>' : ""}
    Updated ${esc(updated)}. Win odds from ESPN, conference odds from <a href="https://titlepaths.com/">Title Paths</a>, rankings from the ${esc(d.poll.poll || "polls")}.
    Ranking and record effects are estimates.
    <div style="margin-top:8px"><button class="btn" id="demoToggle">${demo ? "Back to the real schedule" : "Preview game day (fake scores)"}</button></div>`;
  setTeam(team);
}

const pickTeam = (id) => { if (demo) { state.team = id; boot(); } else setTeam(id); };
$("#pickBtn").addEventListener("click", () => ($("#pickPop").hidden ? openPicker() : closePicker(false)));
$("#pickQ").addEventListener("input", renderPickList);
$("#pickQ").addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { e.preventDefault(); setActive(picker.active + 1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); setActive(picker.active - 1); }
  else if (e.key === "Enter") { e.preventDefault(); const el = document.querySelectorAll("#pickList .opt")[picker.active]; if (el) choose(el.dataset.id); }
  else if (e.key === "Escape") { e.preventDefault(); closePicker(true); }
});
$("#pickList").addEventListener("mousedown", (e) => e.preventDefault()); // keep focus in the search box
$("#pickList").addEventListener("click", (e) => { const el = e.target.closest(".opt"); if (el) choose(el.dataset.id); });
document.addEventListener("click", (e) => { if (!e.target.closest(".picker-wrap")) closePicker(false); });
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && !e.metaKey && !e.ctrlKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) && !document.querySelector("dialog[open]")) {
    e.preventDefault(); openPicker();
  }
});
$("#foot").addEventListener("click", (e) => {
  if (e.target.id !== "demoToggle") return;
  demo = !demo;
  boot().then(() => scrollTo(0, 0));
});
window.addEventListener("hashchange", () => { const id = IX && IX.byAbbr.get(decodeURIComponent(location.hash.slice(1))); if (id && id !== state.team) pickTeam(id); });
$("#hero").addEventListener("click", (e) => {
  const w = e.target.closest && e.target.closest(".wk");
  if (w) { state.week = +w.dataset.week; state.showAll = false; render(); }
});
// Remember which cards and groups are open across re-renders (live updates will re-render).
document.addEventListener("toggle", (e) => {
  const el = e.target;
  const key = el.dataset && (el.dataset.id || (el.dataset.g && "g:" + el.dataset.g));
  if (!key) return;
  if (el.dataset.g && el.dataset.g.startsWith("routine-")) el.open ? state.open.add(key) : state.open.delete(key); // starts closed
  else if (el.dataset.g) el.open ? state.open.delete("closed:" + el.dataset.g) : state.open.add("closed:" + el.dataset.g);
  else el.open ? state.open.add(key) : state.open.delete(key);
}, true);
document.addEventListener("click", (e) => {
  const b = e.target.closest && e.target.closest(".whybtn");
  if (!b) return;
  const id = b.dataset.why, open = b.getAttribute("aria-expanded") !== "true";
  open ? state.open.add(id) : state.open.delete(id);
  b.setAttribute("aria-expanded", open);
  const body = b.closest(".card").querySelector(".whybody");
  if (body) body.hidden = !open;
});
$("#gear").addEventListener("click", () => $("#tune").showModal());
$("#rivals").addEventListener("click", (e) => {
  const id = e.target.dataset.rm; if (!id) return;
  store.set("rivals." + state.team, rivalsFor(state.team).filter((x) => x !== id)); renderTune(); render();
});
$("#addRival").addEventListener("change", (e) => {
  if (!e.target.value) return;
  store.set("rivals." + state.team, [...rivalsFor(state.team), e.target.value]); renderTune(); render();
});
$("#resetRivals").addEventListener("click", () => { store.del("rivals." + state.team); renderTune(); render(); });
$("#weights").addEventListener("input", (e) => {
  const k = e.target.dataset.w; if (!k) return;
  store.set("weights", { ...store.get("weights", {}), [k]: +e.target.value });
  e.target.nextElementSibling.textContent = (+e.target.value).toFixed(1); render();
});
$("#resetWeights").addEventListener("click", () => { store.set("weights", {}); renderTune(); render(); });
boot().catch((e) => { $("#hero").textContent = "Couldn't load this week's games: " + e.message; });
</script>
