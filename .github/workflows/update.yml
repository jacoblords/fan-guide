name: update
on:
  schedule:
    - cron: "*/30 * * * 4,5,6,0" # Thu-Sun: game days
    - cron: "0 */3 * * 1,2,3"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --test test/
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - id: pages
        uses: actions/configure-pages@v5
      - run: curl -sf -o prev.json "${{ steps.pages.outputs.base_url }}/data.json" || true
      # Live data when ESPN answers; otherwise keep what's published, or the committed test data
      # on the first deploy. (ESPN currently refuses fetch.py's User-Agent; see README.)
      - name: Fetch
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: |
          if python3 fetch.py --out live.json $( [ -s prev.json ] && echo --prev prev.json ); then
            mv live.json data.json
          elif [ -s prev.json ]; then
            echo "::warning::Live fetch failed; keeping the published data"
            cp prev.json data.json
          else
            echo "::warning::Live fetch failed; deploying the committed test data"
          fi
      - run: mkdir -p site && cp index.html score.js rivals.json data.json favicon.svg site/
      # The games the live-scores worker may ask ESPN about for this page, from the data deployed.
      - run: python3 fetch.py --live-ids-from data.json --out site/live-ids.json
      # Pages lets browsers cache files for ten minutes; tie the script to this build so a fresh
      # page never runs with an old score.js.
      - run: sed -i "s|src=\"score.js\"|src=\"score.js?v=${GITHUB_SHA::12}\"|" site/index.html && grep -q "score.js?v=" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
